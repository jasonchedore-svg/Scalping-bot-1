[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalping-bot"
version = "0.1.0"
description = "Paper-first swing (recommended) and educational scalping bot with key-free Yahoo backtests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scalping Bot Contributors" }]
keywords = ["trading", "scalping", "alpaca", "crypto", "stocks", "paper-trading"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "alpaca-py>=0.40.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "typer>=0.12",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
scalping-bot = "scalping_bot.cli:app"

[project.urls]
Homepage = "https://github.com/jasonchedore-svg/Scalping-bot-1"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scalping_bot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["scalping_bot"]
branch = true

[tool.coverage.report]
omit = ["src/scalping_bot/cli.py"]
